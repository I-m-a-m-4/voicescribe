name: Build & Package VoiceScribe (Windows, macOS, Android)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop (MSI & EXE)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        env:
          BUILD_TARGET: tauri
        run: npm run build

      - name: Build Windows MSI & EXE Bundles
        run: npx tauri build --bundles msi,nsis

      - name: Upload Windows MSI & EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScribe-Windows-Builds
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-macos:
    name: Build macOS Desktop (DMG & APP)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        env:
          BUILD_TARGET: tauri
        run: npm run build

      - name: Build macOS DMG & APP Bundles
        run: npx tauri build --bundles dmg,app

      - name: Upload macOS DMG & APP Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScribe-macOS-Builds
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

  build-android:
    name: Build Android Packages (APK & AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android NDK & SDK Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        env:
          BUILD_TARGET: tauri
        run: npm run build

      - name: Build Android APK & AAB
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          npx tauri android build --apk --aab --ci

      - name: Upload Android APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceScribe-Android-Builds
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-android]
    if: ${{ !cancelled() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Publish to GitHub Releases Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'VoiceScribe ${{ github.ref_name }} Native Release'
          body: |
            ## VoiceScribe Native Multi-Platform Release

            Download official VoiceScribe binaries for your device:
            - 🖥️ **Windows**: `.msi` (Microsoft Store / Installer) & `.exe` (NSIS Setup)
            - 🍏 **macOS**: `.dmg` (Disk Image)
            - 📱 **Android**: `.apk` (Standalone Package) & `.aab` (Google Play Bundle)
          draft: false
          prerelease: false
          files: |
            ./artifacts/**/*.msi
            ./artifacts/**/*.exe
            ./artifacts/**/*.dmg
            ./artifacts/**/*.apk
            ./artifacts/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
