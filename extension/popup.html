<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceScribe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            width: 500px;
            height: 640px;
            background-color: #09090b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(18, 18, 20, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
        }
        .brand img {
            width: 24px;
            height: 24px;
            border-radius: 6px;
        }
        .brand .status-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #22c55e;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .server-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fb923c;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
        }
        .server-select option {
            background: #18181b;
            color: #fff;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 9px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: #ea580c;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #f97316;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #e4e4e7;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }
        .iframe-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #09090b;
        }
        .banner-tip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(234, 88, 12, 0.12);
            border-bottom: 1px solid rgba(234, 88, 12, 0.25);
            font-size: 11px;
            color: #fdba74;
        }
        .banner-tip span {
            font-weight: 500;
        }
        .banner-tip a {
            color: #fff;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 600;
        }
        .offline-message {
            display: none;
            position: absolute;
            inset: 0;
            background: #09090b;
            padding: 32px 24px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 5;
        }
        .offline-message.visible {
            display: flex;
        }
        .offline-icon {
            width: 52px;
            height: 52px;
            background: rgba(234, 88, 12, 0.15);
            color: #f97316;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .offline-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .offline-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            line-height: 1.5;
            max-width: 340px;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="#" class="brand" id="brandLink" title="VoiceScribe">
            <img src="icon.png" alt="VoiceScribe">
            <span>VoiceScribe</span>
            <span class="status-dot" title="Live & Connected"></span>
        </a>
        <div class="controls">
            <select id="serverSelect" class="server-select" title="Switch between Live Site and Localhost">
                <option value="https://usevoicescribe.vercel.app">Live Cloud (Vercel)</option>
                <option value="http://localhost:3001">localhost:3001</option>
                <option value="http://localhost:3000">localhost:3000</option>
            </select>
            <button id="openMiniWindowBtn" class="btn-action btn-primary" title="Open floating mini window (Recommended for microphone & Google login)">
                Mini App 🗗
            </button>
            <button id="openTabBtn" class="btn-action btn-secondary" title="Open full VoiceScribe in a new browser tab">
                Tab ↗
            </button>
        </div>
    </div>

    <div class="banner-tip">
        <span>💡 For recording in Brave, use <strong>Mini App</strong> or <strong>Tab</strong> for mic access</span>
    </div>

    <div class="iframe-container">
        <iframe 
            id="appFrame" 
            src="https://usevoicescribe.vercel.app" 
            allow="microphone *; camera *; clipboard-write; clipboard-read; display-capture">
        </iframe>
        
        <div id="offlineCard" class="offline-message">
            <div class="offline-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
            </div>
            <div class="offline-title">Opening VoiceScribe Live...</div>
            <div class="offline-desc">
                If the embedded view is shielded by Brave, click below to launch VoiceScribe in a standalone window or new tab.
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="retryMiniBtn" class="btn-action btn-primary" style="padding: 9px 18px; font-size: 12px;">
                    Launch Mini App 🗗
                </button>
                <button id="retryTabBtn" class="btn-action btn-secondary" style="padding: 9px 18px; font-size: 12px;">
                    Open in Tab ↗
                </button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
